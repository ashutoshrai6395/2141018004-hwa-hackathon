<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SniffVault | Timed Dog Puzzle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container nav">
      <img src="images/logo.png" alt="SniffVault" class="logo">
      <nav>
        <a href="#product">Shop</a>
        <a href="#cart">Cart</a>
      </nav>
      <div class="cart-badge" id="cart-badge">0</div>
    </div>
  </header>

  <section id="product" class="product-section">
    <div class="container product-grid">
      <div class="product-media">
        <img src="images/main.png" alt="SniffVault charcoal" id="main-img" class="main-img">
        <div class="thumbs">
          <img src="images/main.png" alt="Main" class="thumb active" onclick="setThumb(this, 'images/main.png')">
          <img src="images/charcoal.png" alt="Charcoal" class="thumb" onclick="setThumb(this, 'images/charcoal.png')">
          <img src="images/drawers.png" alt="Drawers" class="thumb" onclick="setThumb(this, 'images/drawers.png')">
          <img src="images/inserts.png" alt="Inserts" class="thumb" onclick="setThumb(this, 'images/inserts.png')">
          <img src="images/lifestyle.png" alt="Lifestyle" class="thumb" onclick="setThumb(this, 'images/lifestyle.png')">
        </div>
      </div>
      <div class="product-info">
        <h1>SniffVault</h1>
        <p class="subtitle">4-drawer timed dog puzzle</p>
        <p class="desc">One drawer unlocks every 4&ndash;6 hours to keep your dog busy and mentally engaged all day long.</p>

        <div class="color-selector">
          <span class="label">Color</span>
          <button class="color-swatch charcoal selected" data-color="charcoal" onclick="selectColor(this, 'charcoal')"></button>
          <button class="color-swatch sage" data-color="sage" onclick="selectColor(this, 'sage')"></button>
        </div>

        <div class="price">$79</div>

        <div class="addon">
          <input type="checkbox" id="addon" checked>
          <label for="addon">Add silicone link insert &mdash; +$14</label>
        </div>

        <div class="qty">
          <label>Quantity</label>
          <input type="number" id="qty" value="1" min="1">
        </div>

        <button class="btn btn-primary" id="add-to-cart">Add to Cart</button>
      </div>
    </div>
  </section>

  <section id="cart" class="cart-section">
    <div class="container">
      <h2>Your Cart</h2>
      <div id="cart-items"></div>
      <div class="cart-total">
        <span>Total</span>
        <span id="cart-total">$0</span>
      </div>
      <button class="btn btn-primary" id="checkout-btn">Guest Checkout</button>
    </div>
  </section>

  <section id="checkout" class="checkout-section hidden">
    <div class="container checkout-card">
      <h2>Guest Checkout</h2>
      <form id="checkout-form">
        <div class="form-row">
          <label>Name</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-row">
          <label>Email</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-row">
          <label>Shipping Address</label>
          <input type="text" name="address" required>
        </div>
        <button class="btn btn-primary" type="submit">Place Order</button>
      </form>
      <div id="checkout-msg"></div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
